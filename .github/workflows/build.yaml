name: Build image

on:
  push:
    branches:
      - main

# Builds run one at a time, so two pushes can't race to update newTag.
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aldicovo/cv-aldi-lukito

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Use the commit code as the image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # GITHUB_TOKEN can't write to another repo, so this uses a deploy key on AldiDevOps.
      - uses: actions/checkout@v7.0.1
        with:
          repository: aldiCovo/AldiDevOps
          ssh-key: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }}
          path: config

      - name: Point the manifests at the new tag
        working-directory: config
        run: |
          # Quoted, because a tag made only of digits would otherwise be a YAML number.
          sed -i "s/^\( *newTag:\).*/\1 \"$TAG\"/" CV_Aldi_Lukito/kustomization.yaml
          if git diff --quiet; then
            echo "No newTag to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy CV image $TAG"
          git push
