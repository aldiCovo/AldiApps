<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Prastika Admin</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/admin/admin.js" defer></script>
  <script src="/admin/products.js" defer></script>
</head>
<body>
  <header class="bar">
    <div class="bar-brand"><span class="brand">Prastika</span><span class="badge-admin">Admin</span></div>
    <nav id="nav" class="nav" aria-label="Menu admin" hidden>
      <a class="nav-link" href="#pesanan" data-view="orders">Pesanan</a>
      <a class="nav-link" href="#produk" data-view="products">Produk</a>
    </nav>
    <div id="who" class="who" hidden>
      <span id="who-name"></span>
      <button id="logout" class="link" type="button">Keluar</button>
    </div>
  </header>

  <main>
    <p id="loading" class="muted">Memuat…</p>

    <section id="login-view" class="login" hidden aria-labelledby="login-title">
      <h1 id="login-title">Masuk admin</h1>
      <p class="muted">Khusus akun admin toko. Akun pembeli tidak bisa masuk di sini.</p>
      <form id="login-form" novalidate>
        <label>Email <input id="login-email" type="email" autocomplete="username" required maxlength="254"></label>
        <label>Kata sandi <input id="login-password" type="password" autocomplete="current-password" required maxlength="200"></label>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button id="login-submit" class="primary" type="submit">Masuk</button>
      </form>
    </section>

    <section id="orders-view" hidden aria-labelledby="orders-title">
      <div class="view-head">
        <h1 id="orders-title">Pesanan</h1>
        <button id="reload" class="secondary" type="button">Muat ulang</button>
      </div>
      <div class="tabs" role="group" aria-label="Status pesanan">
        <button class="tab" type="button" data-status="paid" aria-pressed="true">Perlu dikemas</button>
        <button class="tab" type="button" data-status="packed" aria-pressed="false">Dikemas</button>
        <button class="tab" type="button" data-status="shipped" aria-pressed="false">Dikirim</button>
        <button class="tab" type="button" data-status="completed" aria-pressed="false">Selesai</button>
        <button class="tab" type="button" data-status="" aria-pressed="false">Semua</button>
      </div>
      <p id="orders-status" class="status" role="status" aria-live="polite"></p>
      <div id="orders-list" class="orders"></div>
      <button id="more" class="secondary more" type="button" hidden>Muat lebih banyak</button>
    </section>
    <section id="products-view" hidden aria-labelledby="products-title">
      <div class="view-head">
        <h1 id="products-title">Produk</h1>
        <div class="head-actions">
          <button id="toggle-categories" class="secondary" type="button" aria-expanded="false" aria-controls="categories-panel">Kelola kategori</button>
          <button id="toggle-new-product" class="primary" type="button" aria-expanded="false" aria-controls="new-product-panel">Tambah produk</button>
        </div>
      </div>

      <section id="categories-panel" class="panel" hidden aria-labelledby="categories-title">
        <h2 id="categories-title">Kategori</h2>
        <p class="muted small">Kategori yang masih punya produk tidak bisa dihapus.</p>
        <div id="category-rows" class="category-rows"></div>
        <form id="new-category" class="inline-form" novalidate>
          <label>Kategori baru <input id="new-category-name" type="text" maxlength="200" required></label>
          <button class="primary" type="submit">Tambah kategori</button>
        </form>
        <p id="categories-status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section id="new-product-panel" class="panel" hidden aria-labelledby="new-product-title">
        <h2 id="new-product-title">Produk baru</h2>
        <div id="new-product-form"></div>
      </section>

      <div class="tabs" id="category-filter" role="group" aria-label="Kategori"></div>
      <p id="products-status" class="status" role="status" aria-live="polite"></p>
      <div id="product-list" class="orders"></div>
      <button id="more-products" class="secondary more" type="button" hidden>Muat lebih banyak</button>
    </section>
  </main>
</body>
</html>
